spring.application.name=garage-management
server.port=8080

# ---------- MySQL (change username/password to match your MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/garage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- JWT ----------
app.jwt.secret=GarageManagementSuperSecretKeyForJwtSigning2026ChangeMeInProduction!!
app.jwt.expiration-ms=86400000

# ---------- CORS (React dev server) ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Business ----------
app.tax-rate=0.18
